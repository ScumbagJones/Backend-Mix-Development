<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYLIST RIPPER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #15151f;
            --border: #2a2a3e;
            --accent: #00ff9f;
            --accent2: #ff0080;
            --text: #ffffff;
            --text-dim: #8a8a9f;
            --glow: rgba(0, 255, 159, 0.3);
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Scanline CRT effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 9999;
        }

        nav {
            background: var(--surface);
            border-bottom: 2px solid var(--accent);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        nav::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
            background-size: 200% 100%;
            animation: borderSlide 3s linear infinite;
        }

        @keyframes borderSlide {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--accent);
            text-shadow: 0 0 10px var(--glow);
            letter-spacing: -2px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .nav-links a {
            color: var(--text-dim);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a:hover { color: var(--accent); }
        .nav-links a.active { color: var(--accent); }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--glow);
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page { display: none; }
        .page.active { display: block; }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .terminal-box {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
        }

        .terminal-header {
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input[type="text"] {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            border-radius: 4px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--glow);
        }

        input[type="text"]::placeholder {
            color: var(--text-dim);
        }

        .platform-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .platform-btn {
            background: var(--surface);
            border: 2px solid var(--border);
            color: var(--text-dim);
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .platform-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px var(--glow);
        }

        .platform-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            color: var(--bg);
            padding: 1rem 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px var(--glow);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .btn-full {
            grid-column: span 2;
        }

        .status {
            background: var(--bg);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            display: none;
        }

        .status.show { display: block; }
        .status.error { border-left-color: var(--accent2); color: var(--accent2); }
        .status.success { border-left-color: var(--accent); color: var(--accent); }

        .track-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .track {
            background: var(--bg);
            border-left: 3px solid var(--accent);
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .track:hover {
            border-left-width: 5px;
            background: var(--surface);
        }

        .track-title {
            color: var(--text);
            font-weight: 700;
        }

        .track-artist {
            color: var(--text-dim);
            font-size: 0.8rem;
        }

        /* Editor */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .timeline {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            min-height: 300px;
        }

        .timeline-track {
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: move;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }

        .control-btn {
            background: var(--bg);
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 0.75rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            border-radius: 4px;
            margin: 0.5rem;
        }

        .control-btn:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .record-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent2);
            border: 4px solid var(--bg);
            box-shadow: 0 0 20px rgba(255, 0, 128, 0.5);
            cursor: pointer;
            color: var(--bg);
            font-size: 2rem;
        }

        .record-btn:hover {
            transform: scale(1.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .stat-card {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: 1rem;
            text-align: center;
        }

        .stat-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px var(--glow);
        }

        .stat-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">PLAYLIST//RIPPER</div>
        <div class="nav-links">
            <a href="#" onclick="showPage('converter')" class="active">CONVERTER</a>
            <a href="#" onclick="showPage('editor')">EDITOR</a>
            <a href="#" onclick="openAudacity()">AUDACITY</a>
        </div>
    </nav>

    <div class="container">
        <div id="converter" class="page active">
            <h1>EXTRACT</h1>
            <div id="status" class="status"></div>

            <div class="terminal-box">
                <div class="terminal-header">&gt; SELECT PLATFORM</div>
                <div class="platform-grid">
                    <button class="platform-btn active" data-platform="spotify">SPOTIFY</button>
                    <button class="platform-btn" data-platform="youtube">YOUTUBE</button>
                    <button class="platform-btn" data-platform="soundcloud">SOUNDCLOUD</button>
                    <button class="platform-btn" data-platform="bandcamp">BANDCAMP</button>
                </div>
            </div>

            <div class="terminal-box">
                <div class="terminal-header">&gt; PASTE URL</div>
                <input type="text" id="playlist-url" placeholder="https://open.spotify.com/playlist/...">
            </div>

            <div class="terminal-box">
                <div class="terminal-header">&gt; EXECUTE</div>
                <div class="btn-grid">
                    <button class="btn" onclick="extractPlaylist()">EXTRACT</button>
                    <button class="btn" onclick="identifyTracks()" disabled id="btn-identify">IDENTIFY</button>
                    <button class="btn" onclick="downloadTracks()" disabled id="btn-download">DOWNLOAD</button>
                    <button class="btn btn-full" onclick="quickConvert()">⚡ RIP EVERYTHING</button>
                </div>
            </div>

            <div id="result" class="terminal-box" style="display:none;">
                <div class="terminal-header">&gt; RESULTS</div>
                <div id="result-content"></div>
            </div>
        </div>

        <div id="editor" class="page">
            <h1>REMIX</h1>
            <div class="terminal-box">
                <div class="terminal-header">&gt; TIMELINE</div>
                <div class="editor-grid">
                    <div class="timeline" id="timeline">
                        <div style="color: var(--text-dim); text-align: center; padding: 2rem;">
                            Drag MP3s here
                        </div>
                    </div>
                    <div>
                        <h3 style="margin-bottom: 1rem; color: var(--accent);">CONTROLS</h3>
                        <button class="control-btn" onclick="playTimeline()">▶ PLAY</button>
                        <button class="control-btn" onclick="clearTimeline()">🗑 CLEAR</button>
                        <button class="control-btn" onclick="exportTimeline()">💾 EXPORT</button>

                        <div style="text-align: center; margin-top: 2rem;">
                            <h4 style="margin-bottom: 1rem; color: var(--accent);">VOICE MEMO</h4>
                            <button class="record-btn" id="record-btn" onclick="toggleRecording()">●</button>
                            <p style="margin-top: 1rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-dim);" id="record-status">Click to record</p>
                        </div>

                        <button class="control-btn" style="width: 100%; margin-top: 1.5rem;" onclick="openAudacity()">
                            🎚 OPEN AUDACITY
                        </button>
                    </div>
                </div>
            </div>

            <div class="terminal-box">
                <div class="terminal-header">&gt; LIBRARY</div>
                <div id="library" class="track-list">
                    <div style="color: var(--text-dim); text-align: center; padding: 2rem;">
                        Download tracks first
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.getElementById(page).classList.add('active');
            event.target.classList.add('active');
        }

        function showStatus(msg, type = 'info') {
            const s = document.getElementById('status');
            s.className = `status ${type} show`;
            s.textContent = msg;
        }

        async function extractPlaylist() {
            const url = document.getElementById('playlist-url').value.trim();
            if (!url) {
                showStatus('⚠ ENTER URL', 'error');
                return;
            }

            showStatus('EXTRACTING...', 'info');

            try {
                const r = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await r.json();
                if (data.error) {
                    showStatus('✗ ' + data.error.toUpperCase(), 'error');
                    return;
                }

                currentJobId = data.job_id;
                showStatus(`✓ ${data.playlist.total_tracks} TRACKS`, 'success');
                displayTracks(data.playlist);
                document.getElementById('btn-identify').disabled = false;

            } catch (e) {
                showStatus('✗ ' + e.message.toUpperCase(), 'error');
            }
        }

        async function identifyTracks() {
            if (!currentJobId) return;
            showStatus('IDENTIFYING...', 'info');

            try {
                const r = await fetch(`/api/identify/${currentJobId}`, { method: 'POST' });
                const data = await r.json();
                if (data.error) {
                    showStatus('✗ ' + data.error.toUpperCase(), 'error');
                    return;
                }

                showStatus(`✓ MATCHED ${data.matched}/${data.total}`, 'success');
                document.getElementById('btn-download').disabled = false;

            } catch (e) {
                showStatus('✗ ' + e.message.toUpperCase(), 'error');
            }
        }

        async function downloadTracks() {
            if (!currentJobId) return;
            showStatus('DOWNLOADING...', 'info');

            try {
                const r = await fetch(`/api/download/${currentJobId}`, { method: 'POST' });
                const data = await r.json();
                if (data.error) {
                    showStatus('✗ ' + data.error.toUpperCase(), 'error');
                    return;
                }

                showStatus('✓ DOWNLOAD STARTED', 'success');

                const interval = setInterval(async () => {
                    const sr = await fetch(`/api/status/${currentJobId}`);
                    const sdata = await sr.json();

                    if (sdata.status === 'downloaded') {
                        clearInterval(interval);
                        const stats = sdata.stats;
                        showStatus(`✓ ${stats.success} SUCCESS / ${stats.failed} FAILED`, 'success');
                        displayStats(stats);
                    }
                }, 2000);

            } catch (e) {
                showStatus('✗ ' + e.message.toUpperCase(), 'error');
            }
        }

        async function quickConvert() {
            const url = document.getElementById('playlist-url').value.trim();
            if (!url) {
                showStatus('⚠ ENTER URL', 'error');
                return;
            }

            showStatus('RIPPING...', 'info');

            try {
                const r = await fetch('/api/quick', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await r.json();
                if (data.error) {
                    showStatus('✗ ' + data.error.toUpperCase(), 'error');
                    return;
                }

                showStatus(`✓ ${data.downloaded} TRACKS`, 'success');
                displayQuickResults(data);

            } catch (e) {
                showStatus('✗ ' + e.message.toUpperCase(), 'error');
            }
        }

        function displayTracks(playlist) {
            const r = document.getElementById('result');
            const c = document.getElementById('result-content');

            let html = `<p><strong>${playlist.name}</strong> BY ${playlist.owner}</p><div class="track-list">`;

            playlist.tracks.forEach((t, i) => {
                html += `<div class="track"><div class="track-title">[${String(i + 1).padStart(2, '0')}] ${t.title}</div><div class="track-artist">${t.artist}</div></div>`;
            });

            html += '</div>';
            c.innerHTML = html;
            r.style.display = 'block';
        }

        function displayStats(stats) {
            const c = document.getElementById('result-content');
            c.innerHTML += `<div class="stats-grid"><div class="stat-card"><div class="stat-number">${stats.success}</div><div class="stat-label">SUCCESS</div></div><div class="stat-card"><div class="stat-number">${stats.failed}</div><div class="stat-label">FAILED</div></div><div class="stat-card"><div class="stat-number">${stats.skipped}</div><div class="stat-label">SKIPPED</div></div></div>`;
        }

        function displayQuickResults(data) {
            const r = document.getElementById('result');
            const c = document.getElementById('result-content');
            c.innerHTML = `<p><strong>${data.playlist_name}</strong></p><div class="stats-grid"><div class="stat-card"><div class="stat-number">${data.total_tracks}</div><div class="stat-label">TOTAL</div></div><div class="stat-card"><div class="stat-number">${data.identified}</div><div class="stat-label">IDENTIFIED</div></div><div class="stat-card"><div class="stat-number">${data.downloaded}</div><div class="stat-label">DOWNLOADED</div></div></div>`;
            r.style.display = 'block';
        }

        async function toggleRecording() {
            const btn = document.getElementById('record-btn');
            const status = document.getElementById('record-status');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);

                    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        status.textContent = 'Saved';
                        audioChunks = [];
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    status.textContent = 'Recording...';

                } catch (e) {
                    showStatus('✗ MIC ACCESS DENIED', 'error');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                status.textContent = 'Click to record';
            }
        }

        function playTimeline() { showStatus('▶ PLAYING', 'success'); }
        function clearTimeline() { document.getElementById('timeline').innerHTML = '<div style="color: var(--text-dim); text-align: center; padding: 2rem;">Drag MP3s here</div>'; }
        function exportTimeline() { showStatus('💾 EXPORTING', 'success'); }
        function openAudacity() { window.open('https://www.audacityteam.org/download/', '_blank'); }

        fetch('/health').then(r => r.json()).then(data => {
            if (!data.spotify_configured) {
                showStatus('⚠ SPOTIFY NOT CONFIGURED', 'error');
            }
        });
    </script>
</body>
</html>

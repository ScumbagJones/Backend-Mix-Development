<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-extract {
            background: #667eea;
        }

        .btn-identify {
            background: #f093fb;
        }

        .btn-download {
            background: #4facfe;
        }

        .btn-quick {
            background: #43e97b;
            grid-column: span 2;
            font-size: 18px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .track-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .track {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .track-title {
            font-weight: 600;
            color: #333;
        }

        .track-artist {
            color: #666;
            font-size: 14px;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 14px;
        }

        .example {
            background: #e8f4f8;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Playlist Converter</h1>
        <p class="subtitle">Convert Spotify & YouTube playlists to MP3</p>

        <div id="status-message"></div>

        <div class="input-group">
            <label for="playlist-url">Playlist URL</label>
            <input
                type="text"
                id="playlist-url"
                placeholder="Paste Spotify or YouTube playlist URL here..."
            >
            <div class="example">
                Example: https://open.spotify.com/playlist/...
            </div>
        </div>

        <div class="button-group">
            <button class="btn-extract" onclick="extractPlaylist()">
                1. Extract Metadata
            </button>
            <button class="btn-identify" onclick="identifyTracks()" disabled id="btn-identify">
                2. Identify Songs
            </button>
            <button class="btn-download" onclick="downloadTracks()" disabled id="btn-download">
                3. Download MP3s
            </button>
            <button class="btn-quick" onclick="quickConvert()">
                ⚡ Quick Mode (Do Everything)
            </button>
        </div>

        <div id="result" class="result">
            <h3>Results</h3>
            <div id="result-content"></div>
        </div>

        <div class="footer">
            Playlist Converter v1.0 | Port 8002 | Press Ctrl+C to stop
        </div>
    </div>

    <script>
        let currentJobId = null;

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status-message');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }

        function showLoading(message) {
            showStatus(message + '...', 'info');
            const statusDiv = document.getElementById('status-message');
            statusDiv.innerHTML = message + '<span class="loading"></span>';
        }

        async function extractPlaylist() {
            const url = document.getElementById('playlist-url').value.trim();

            if (!url) {
                showStatus('Please enter a playlist URL', 'error');
                return;
            }

            showLoading('Extracting playlist');

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.error) {
                    showStatus('Error: ' + data.error, 'error');
                    return;
                }

                currentJobId = data.job_id;
                showStatus(`✓ Extracted: ${data.playlist.name} (${data.playlist.total_tracks} tracks)`, 'success');

                // Show tracks
                const resultDiv = document.getElementById('result');
                const contentDiv = document.getElementById('result-content');

                let html = `<p><strong>${data.playlist.name}</strong> by ${data.playlist.owner}</p>`;
                html += '<div class="track-list">';

                data.playlist.tracks.forEach((track, i) => {
                    html += `
                        <div class="track">
                            <div class="track-title">${i + 1}. ${track.title}</div>
                            <div class="track-artist">${track.artist}${track.album ? ' - ' + track.album : ''}</div>
                        </div>
                    `;
                });

                html += '</div>';
                contentDiv.innerHTML = html;
                resultDiv.classList.add('show');

                // Enable next button
                document.getElementById('btn-identify').disabled = false;

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function identifyTracks() {
            if (!currentJobId) {
                showStatus('Please extract playlist first', 'error');
                return;
            }

            showLoading('Identifying songs with MusicBrainz');

            try {
                const response = await fetch(`/api/identify/${currentJobId}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.error) {
                    showStatus('Error: ' + data.error, 'error');
                    return;
                }

                showStatus(`✓ Identified ${data.matched}/${data.total} tracks`, 'success');
                document.getElementById('btn-download').disabled = false;

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function downloadTracks() {
            if (!currentJobId) {
                showStatus('Please extract playlist first', 'error');
                return;
            }

            showLoading('Downloading tracks from YouTube');

            try {
                const response = await fetch(`/api/download/${currentJobId}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.error) {
                    showStatus('Error: ' + data.error, 'error');
                    return;
                }

                showStatus('✓ Download started! Check console for progress.', 'success');

                // Poll for status
                const interval = setInterval(async () => {
                    const statusResponse = await fetch(`/api/status/${currentJobId}`);
                    const statusData = await statusResponse.json();

                    if (statusData.status === 'downloaded') {
                        clearInterval(interval);
                        const stats = statusData.stats;
                        showStatus(
                            `✓ Complete! Downloaded ${stats.success} tracks (${stats.failed} failed)`,
                            'success'
                        );

                        const contentDiv = document.getElementById('result-content');
                        contentDiv.innerHTML += `
                            <div class="stats">
                                <div class="stat-box">
                                    <div class="stat-number">${stats.success}</div>
                                    <div class="stat-label">Success</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-number">${stats.failed}</div>
                                    <div class="stat-label">Failed</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-number">${stats.skipped}</div>
                                    <div class="stat-label">Skipped</div>
                                </div>
                            </div>
                        `;
                    }
                }, 2000);

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        async function quickConvert() {
            const url = document.getElementById('playlist-url').value.trim();

            if (!url) {
                showStatus('Please enter a playlist URL', 'error');
                return;
            }

            showLoading('Running full conversion (this may take a while)');

            try {
                const response = await fetch('/api/quick', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (data.error) {
                    showStatus('Error: ' + data.error, 'error');
                    return;
                }

                showStatus(
                    `✓ Complete! ${data.playlist_name} - Downloaded ${data.downloaded}/${data.total_tracks} tracks`,
                    'success'
                );

                const resultDiv = document.getElementById('result');
                const contentDiv = document.getElementById('result-content');

                contentDiv.innerHTML = `
                    <p><strong>${data.playlist_name}</strong></p>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-number">${data.total_tracks}</div>
                            <div class="stat-label">Total Tracks</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${data.identified}</div>
                            <div class="stat-label">Identified</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-number">${data.downloaded}</div>
                            <div class="stat-label">Downloaded</div>
                        </div>
                    </div>
                    <p style="margin-top: 20px; text-align: center;">
                        MP3 files saved to: <code>downloads/</code>
                    </p>
                `;

                resultDiv.classList.add('show');

            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        // Check health on load
        fetch('/health')
            .then(r => r.json())
            .then(data => {
                if (!data.spotify_configured) {
                    showStatus('⚠️ Spotify API not configured. Add credentials to .env file', 'error');
                }
            });
    </script>
</body>
</html>
